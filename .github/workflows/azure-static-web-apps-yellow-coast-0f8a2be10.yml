name: Frontend CI and manual Azure TEST deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      destination:
        description: Explicit destination confirmation (TEST only)
        required: true
        type: choice
        options: [DO_NOT_DEPLOY, TEST]
        default: DO_NOT_DEPLOY

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Authentication and deployment security checks
        run: |
          node --test .github/scripts/test-deployment-gate.mjs
          npm run test:auth-mobile
          node scripts/test-platform-role.mjs
          npm run test:invitation-links
          node scripts/test-auth-completion.mjs
          node scripts/test-ios-msal-configuration.mjs
          node scripts/test-mobile-v5.mjs
          node --test tests/testflight-external.test.mjs
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-test-${{ github.sha }}
          path: dist/avalon-ng/browser
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  deploy_test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.destination == 'TEST' && github.ref == 'refs/heads/main' && github.repository == 'arciero10/gestionale-frontend' }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    environment: TEST
    concurrency:
      group: azure-frontend-test-deployment
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fail closed unless TEST approval protections are effective
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/verify-test-environment.mjs
      - uses: actions/download-artifact@v4
        with:
          name: frontend-test-${{ github.sha }}
          path: deploy/browser
      - name: Deploy already-tested artifact to the dedicated TEST site
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_TEST_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: deploy/browser
          api_location: ''
          output_location: ''
          skip_app_build: true
          skip_api_build: true
          production_branch: main
      - name: Verify TEST site availability
        run: curl --fail --silent --show-error --retry 2 --output /dev/null https://test.eventidicomunita.it/
